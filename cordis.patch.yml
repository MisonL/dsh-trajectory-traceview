# dsh-trajectory-traceview-plus bundle patch: adds this local plugin row to the web
# profile composition. Applied as a bundle layer (dsh.bundle.patch) after
# dsh-base and dsh-web-app, so the row lands beside the other dsh.client rows.
#
# The plugin is client-only: the host half is a no-op that ships purely to make
# the row a valid Loader entry, while the real surface (the "轨迹视图" mind-map
# tab next to 轨迹) lives in the browser bundle discovered via dsh.client exports.
- insert:
    - id: dsh-trajectory-traceview-plus
      name: dsh-trajectory-traceview-plus
